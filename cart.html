<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Mania | Carrinho</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#f5f5f5}body{background:radial-gradient(circle at top,#171717 0,#080808 42%,#050505 100%)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.topbar{height:72px;display:flex;align-items:center;gap:28px;padding:0 38px;background:#050505;border-bottom:1px solid #222;position:sticky;top:0;z-index:50}.brand img{width:104px;height:62px;object-fit:contain}.topbar nav{display:flex;gap:24px;font-size:14px;white-space:nowrap}.topbar nav a:hover,.toplink:hover{color:#aaa}.search{margin-left:auto;width:min(390px,31vw);height:42px;background:#171717;border:1px solid #333;border-radius:7px;display:flex;align-items:center}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#fff;padding:0 13px}.search span{font-size:23px;padding:0 12px;color:#ddd}.toplink,.carttop{font-size:14px;white-space:nowrap}.wrap{max-width:1240px;margin:0 auto;padding:36px 30px 70px}.muted{color:#999}.panel{background:#111;border:1px solid #292929;border-radius:10px}.btn{border:0;border-radius:7px;padding:13px 18px;cursor:pointer;font-weight:700}.btn-primary{background:#f3f3f3;color:#080808}.btn-dark{background:#171717;color:#fff;border:1px solid #3a3a3a}@media(max-width:900px){.topbar{gap:14px;padding:0 16px}.topbar nav{display:none}.search{width:auto;flex:1}.toplink{display:none}.wrap{padding:24px 16px 50px}}</style><style>.layout{display:grid;grid-template-columns:1fr 330px;gap:22px}h1{font-size:30px;margin:0 0 6px}.item{display:grid;grid-template-columns:115px 1fr auto;gap:17px;align-items:center;padding:15px;background:#111;border:1px solid #292929;border-radius:9px}.item img{width:115px;height:145px;object-fit:cover;border-radius:6px}.item h3{margin:0 0 7px}.item p{margin:4px 0;color:#999;font-size:13px}.price{font-size:19px;font-weight:800;text-align:right}.qty{display:flex;align-items:center;gap:8px;margin-top:12px}.qty button{width:30px;height:30px;background:#191919;color:#fff;border:1px solid #444;border-radius:5px}.remove{background:none;border:0;color:#999;text-decoration:underline;margin-top:10px;cursor:pointer}.summary{padding:22px;position:sticky;top:90px;height:max-content}.summary h2{margin-top:0}.row,.total{display:flex;justify-content:space-between;padding:11px 0;color:#bbb}.total{border-top:1px solid #333;margin-top:8px;padding-top:17px;color:#fff;font-size:21px}.full{width:100%;margin-top:12px}.empty{text-align:center;padding:55px 20px}.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.rec{background:#111;border:1px solid #292929;border-radius:9px;overflow:hidden;cursor:pointer}.rec img{width:100%;height:160px;object-fit:cover}.rec div{padding:12px}.rec small{color:#999}.rec strong{display:block;margin:5px 0}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}.recs{grid-template-columns:1fr 1fr}.item{grid-template-columns:80px 1fr}.item img{width:80px;height:105px}.price{grid-column:2;text-align:left}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><img src="logo-gamemania-cropped.png" alt="Game Mania"></a><nav><a href="index.html">Explorar</a><a href="index.html">Categorias</a><a href="index.html">Plataformas</a><a href="index.html">Mais</a></nav><div class="search"><input placeholder="Buscar na loja..."><span>⌕</span></div><a class="toplink" href="wishlist.html">♡ Lista de desejos <b id="wishCount">0</b></a><a class="carttop" href="cart.html">🛒 Carrinho <b id="cartCount">0</b></a></header><main class="wrap"><div style="color:#888;font-size:13px;margin-bottom:25px"><a href="index.html">Início</a> / Carrinho</div><div class="layout"><section><h1>Seu carrinho</h1><p class="muted" id="label">0 itens</p><div id="items" style="display:flex;flex-direction:column;gap:12px;margin-top:20px"></div></section><aside class="panel summary"><h2>Resumo do pedido</h2><div class="row"><span>Subtotal</span><b id="sub">R$ 0,00</b></div><div class="row"><span>Frete</span><b>Grátis</b></div><div class="total"><span>Total</span><b id="tot">R$ 0,00</b></div><button class="btn btn-primary full" id="goPay">Continuar para pagamento</button><button class="btn btn-dark full" onclick="location.href='index.html'">Continuar comprando</button></aside></div><section style="margin-top:42px"><h2>Você também pode gostar</h2><div id="recs" class="recs"></div></section></main><script>
const products={"gta-v":["Grand Theft Auto V","PlayStation 5",199.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAtJMAM1NtKZtk5w0bj0m2orX3VIcxAozhLo4mPib_ZQ&s=10"],"mortal-kombat":["Mortal Kombat 1","PlayStation 5",249.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfIVfSODaEju3ZxqO6LiccD6rz-FZScpxQ-DMeYJSsmdZv1-vetS81foRD&s=10"],"god-of-war":["God of War Ragnarök","PlayStation 5",249.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYEtW6EDM3rz-OCCFRXFyWiM-6pEksPxn70rX2pqFea8HDvVUQVkabdyE&s=10"],"the-last-of-us":["The Last of Us Part I","PlayStation 5",299.90,"https://www.comboinfinito.com.br/principal/wp-content/uploads/2020/01/art-of-last-of-us-deluxe-cover-cropped-1204635.jpg"],"red-dead-redemption-2":["Red Dead Redemption 2","PlayStation 5",249.90,"https://upload.wikimedia.org/wikipedia/pt/e/e7/Red_Dead_Redemption_2.png"],"gta-vi":["Grand Theft Auto VI","PlayStation 5",449.90,"https://upload.wikimedia.org/wikipedia/en/8/8e/Grand_Theft_Auto_VI.png"],"resident-evil-requiem":["Resident Evil Requiem","PlayStation 5",269.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcosptKczJTvXVq_CroMJk46rJkxQP6K1jXozouDNswQ&s=10"],"forza-horizon-6":["Forza Horizon 6","Xbox Series X|S",319.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1H-CXJ0NpZYozoAo6ha7f3mfuZwgV8SUmX6YOFL4erQ&s"],"marvel-wolverine":["Marvel's Wolverine","PlayStation 5",399.90,"https://upload.wikimedia.org/wikipedia/pt/3/3d/Marvel%27s_Wolverine_cover_art.jpg"],"pragmata":["PRAGMATA","PlayStation 5",239.92,"https://upload.wikimedia.org/wikipedia/commons/f/fb/Pragmata_cover.jpg"]};
function m(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function get(){try{return JSON.parse(localStorage.getItem("gameManiaCartItems")||"[]")}catch(e){return[]}}
function save(a){localStorage.setItem("gameManiaCartItems",JSON.stringify(a));localStorage.setItem("gameManiaCartCount",String(a.reduce((s,i)=>s+i.qty,0)))}
function sync(){const a=get();document.getElementById("cartCount").textContent=a.reduce((s,i)=>s+i.qty,0);try{document.getElementById("wishCount").textContent=JSON.parse(localStorage.getItem("gameManiaWishlist")||"[]").length}catch(e){}}
function render(){const a=get(),box=document.getElementById("items");let sub=0;box.innerHTML="";if(!a.length){box.innerHTML=`<div class="panel empty"><h2>Seu carrinho está vazio</h2><p class="muted">Adicione um jogo para vê-lo aqui.</p><button class="btn btn-primary" onclick="location.href='index.html'">Explorar jogos</button></div>`;document.getElementById("label").textContent="0 itens";document.getElementById("sub").textContent=m(0);document.getElementById("tot").textContent=m(0);document.getElementById("goPay").disabled=true;return}a.forEach((it,i)=>{const p=products[it.slug];if(!p)return;sub+=p[2]*it.qty;const el=document.createElement("article");el.className="item";el.innerHTML=`<img src="${p[3]}" alt="${p[0]}"><div><h3>${p[0]}</h3><p>${p[1]}</p><p>Jogo físico • entrega para todo o Brasil</p><div class="qty"><button onclick="qty(${i},-1)">−</button><span>${it.qty}</span><button onclick="qty(${i},1)">+</button></div><button class="remove" onclick="removeIt(${i})">Remover</button></div><div class="price">${m(p[2]*it.qty)}<div style="font-size:12px;color:#888;margin-top:6px">${m(p[2])} cada</div></div>`;box.appendChild(el)});document.getElementById("label").textContent=a.reduce((s,i)=>s+i.qty,0)+" item(ns)";document.getElementById("sub").textContent=m(sub);document.getElementById("tot").textContent=m(sub);document.getElementById("goPay").disabled=false}
function qty(i,d){const a=get();a[i].qty=Math.max(1,a[i].qty+d);save(a);render();sync()}
function removeIt(i){const a=get();a.splice(i,1);save(a);render();sync()}
document.getElementById("goPay").onclick=()=>{if(get().length)location.href="checkout.html"};
const rec=["gta-v","god-of-war","red-dead-redemption-2"];document.getElementById("recs").innerHTML=rec.map(s=>{const p=products[s];return `<article class="rec" data-slug="${s}"><img src="${p[3]}" alt="${p[0]}"><div><small>${p[1]}</small><strong>${p[0]}</strong>${m(p[2])}</div></article>`}).join("");document.querySelectorAll(".rec").forEach(el=>el.onclick=()=>location.href="produto.html?jogo="+el.dataset.slug);render();sync();
</script></body></html>

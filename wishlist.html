<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Mania | Lista de desejos</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#f5f5f5}body{background:radial-gradient(circle at top,#171717 0,#080808 42%,#050505 100%)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.topbar{height:72px;display:flex;align-items:center;gap:28px;padding:0 38px;background:#050505;border-bottom:1px solid #222;position:sticky;top:0;z-index:50}.brand img{width:104px;height:62px;object-fit:contain}.topbar nav{display:flex;gap:24px;font-size:14px;white-space:nowrap}.topbar nav a:hover,.toplink:hover{color:#aaa}.search{margin-left:auto;width:min(390px,31vw);height:42px;background:#171717;border:1px solid #333;border-radius:7px;display:flex;align-items:center}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;color:#fff;padding:0 13px}.search span{font-size:23px;padding:0 12px;color:#ddd}.toplink,.carttop{font-size:14px;white-space:nowrap}.wrap{max-width:1240px;margin:0 auto;padding:36px 30px 70px}.muted{color:#999}.panel{background:#111;border:1px solid #292929;border-radius:10px}.btn{border:0;border-radius:7px;padding:13px 18px;cursor:pointer;font-weight:700}.btn-primary{background:#f3f3f3;color:#080808}.btn-dark{background:#171717;color:#fff;border:1px solid #3a3a3a}@media(max-width:900px){.topbar{gap:14px;padding:0 16px}.topbar nav{display:none}.search{width:auto;flex:1}.toplink{display:none}.wrap{padding:24px 16px 50px}}</style><style>.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:25px}.card{background:#111;border:1px solid #292929;border-radius:9px;overflow:hidden}.card img{width:100%;height:230px;object-fit:cover;cursor:pointer}.info{padding:14px}.info h3{margin:0 0 7px;font-size:16px}.info p{margin:0 0 10px;color:#999;font-size:12px}.actions{display:flex;gap:8px}.actions button{flex:1}.empty{text-align:center;padding:55px;margin-top:24px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><img src="logo-gamemania-cropped.png" alt="Game Mania"></a><nav><a href="index.html">Explorar</a><a href="index.html">Categorias</a><a href="index.html">Plataformas</a><a href="index.html">Mais</a></nav><div class="search"><input placeholder="Buscar na loja..."><span>⌕</span></div><a class="toplink" href="wishlist.html">♡ Lista de desejos <b id="wishCount">0</b></a><a class="carttop" href="cart.html">🛒 Carrinho <b id="cartCount">0</b></a></header><main class="wrap"><h1>Lista de desejos</h1><p class="muted">Seus jogos salvos para depois.</p><div id="box"></div></main><script>
const products={"gta-v":["Grand Theft Auto V","PlayStation 5",199.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAtJMAM1NtKZtk5w0bj0m2orX3VIcxAozhLo4mPib_ZQ&s=10"],"god-of-war":["God of War Ragnarök","PlayStation 5",249.90,"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYEtW6EDM3rz-OCCFRXFyWiM-6pEksPxn70rX2pqFea8HDvVUQVkabdyE&s=10"],"the-last-of-us":["The Last of Us Part I","PlayStation 5",299.90,"https://www.comboinfinito.com.br/principal/wp-content/uploads/2020/01/art-of-last-of-us-deluxe-cover-cropped-1204635.jpg"],"red-dead-redemption-2":["Red Dead Redemption 2","PlayStation 5",249.90,"https://upload.wikimedia.org/wikipedia/pt/e/e7/Red_Dead_Redemption_2.png"]};
function m(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function list(){try{return JSON.parse(localStorage.getItem("gameManiaWishlist")||"[]")}catch(e){return[]}}
function render(){const a=list(),box=document.getElementById("box");document.getElementById("wishCount").textContent=a.length;if(!a.length){box.innerHTML='<div class="panel empty"><h2>Sua lista está vazia</h2><p class="muted">Clique no coração de um produto para salvá-lo aqui.</p></div>';return}box.innerHTML='<div class="grid">'+a.map(s=>{const p=products[s];if(!p)return "";const card=document.createElement("div");return '<article class="card"><img src="'+p[3]+'" alt="'+p[0]+'" data-slug="'+s+'"><div class="info"><h3>'+p[0]+'</h3><p>'+p[1]+'</p><strong>'+m(p[2])+'</strong><div class="actions" style="margin-top:12px"><button class="btn btn-primary" data-add="'+s+'">Adicionar ao carrinho</button><button class="btn btn-dark" data-remove="'+s+'">♡</button></div></div></article>'}).join('')+'</div>';document.querySelectorAll(".card img").forEach(el=>el.onclick=()=>location.href="produto.html?jogo="+el.dataset.slug);document.querySelectorAll("[data-add]").forEach(el=>el.onclick=e=>{e.stopPropagation();add(el.dataset.add)});document.querySelectorAll("[data-remove]").forEach(el=>el.onclick=e=>{e.stopPropagation();removeW(el.dataset.remove)})}
function add(s){let a;try{a=JSON.parse(localStorage.getItem("gameManiaCartItems")||"[]")}catch(e){a=[]}const x=a.find(i=>i.slug===s);if(x)x.qty++;else a.push({slug:s,qty:1});localStorage.setItem("gameManiaCartItems",JSON.stringify(a));localStorage.setItem("gameManiaCartCount",String(a.reduce((n,i)=>n+i.qty,0)));location.href="cart.html"}function removeW(s){localStorage.setItem("gameManiaWishlist",JSON.stringify(list().filter(x=>x!==s)));render()}render();
</script></body></html>
